<script>
// Paket A (30 soal). Format soal: [no, kompetensi, pertanyaan, [opsi], indeks jawaban, pembahasan] ; Benar/Salah: [no, kompetensi, pertanyaan, [pernyataan], [1=Benar/0=Salah], pembahasan]

const PK={"A": {"D": [{"t": "The Lion and the Mouse", "k": "Narrative \u00b7 Cerita", "p": "<b>The Lion and the Mouse</b>\nOnce upon a time, in a thick jungle in Africa, there lived a strong and fierce lion. Every afternoon, the lion would rest under the cool shade of a big tree after walking through the forest.\nOne day, while he was sleeping, a playful little mouse passed by. The mouse saw the lion\u2019s thick mane and was curious. He climbed up and began to jump around on the lion\u2019s head, playing in his mane.\nThe lion woke up suddenly and was not happy at all. He quickly caught the mouse in his big paw and roared, \u201cWho dares to wake me up?\u201d He was very angry and almost killed the mouse.\nScared and shaking, the mouse begged the lion, \u201cPlease don\u2019t kill me! I didn\u2019t mean to bother you. If you let me go, I promise I\u2019ll help you one day.\u201d The lion laughed loudly, \u201cYou? Help me? That\u2019s funny.\u201d But the lion was feeling kind, so he let the mouse go free.\nA few days later, the lion was walking through the jungle again when he fell into a trap. A net set by hunters caught him, and he couldn\u2019t escape. He tried to bite and tear the ropes, but they were too strong. The lion roared loudly, hoping someone would come.\nThe mouse heard the roar and ran to help. He saw the lion trapped and quickly started to chew the ropes with his sharp teeth. After some time, the net broke, and the lion was free.\nThe lion looked at the mouse with surprise and said, \u201cThank you! You really saved my life.\u201d\nThe mouse smiled and said, \u201cI told you I would help you one day.\u201d\nFrom that moment on, the lion and the mouse became close friends. The lion learned that even small creatures can do great things, and we all need help sometimes.", "q": [[1, "Inferensial \u2013 Ringkasan Cerita", "Which option best summarizes the story?", ["Beginning: A lion was walking through the jungle. Problem: The mouse got lost and couldn't find food. Solution: The lion gave food to the mouse. Lesson: Always be generous to those in need.", "Beginning: A mouse accidentally disturbed a sleeping lion. Problem: The lion was caught in a hunter\u2019s net. Solution: The mouse chewed through the net and set the lion free. Lesson: Even the smallest creature can be a great help.", "Beginning: The lion and mouse were best friends. Problem: The lion got hurt in a fight. Solution: The mouse helped him find water. Lesson: Friendship is built on adventure.", "Beginning: A mouse was building a home near a tree. Problem: A storm destroyed the tree and trapped the lion. Solution: The mouse called for help from the jungle. Lesson: Teamwork solves big problems.", "Beginning: A lion was hungry and searching for food. Problem: He couldn\u2019t catch any prey. Solution: The mouse helped him find food. Lesson: Hunger teaches humility."], 1, "Hanya opsi B yang sesuai alur teks: tikus mengganggu singa, singa terjebak jaring, tikus menggigit tali, pesannya tentang makhluk kecil yang berguna."], [2, "Inferensial \u2013 Pesan Cerita", "Which of the following statements best conveys the message of the story?", ["We should never wake up a sleeping animal", "Even the small and weak can help the strong", "It\u2019s always good to ask for help when we need it", "Lions are dangerous animals and should be avoided", "Never trust anyone who plays with your hair"], {"m": [1, 2]}, "Paragraf akhir: makhluk kecil dapat melakukan hal besar dan semua orang kadang butuh bantuan."], [3, "Tekstual \u2013 Sebab Tindakan", "Why did the lion trust the mouse and decide to let him go instead of eating him?", ["The lion was too tired to eat the mouse", "The mouse told the lion he might help him one day", "The lion was feeling happy to see the mouse", "The lion heard someone coming and got scared", "The mouse promised to bring food for the lion"], 1, "Tikus berjanji, \u201cI\u2019ll help you one day\u201d, dan singa sedang berbaik hati."], [4, "Inferensial \u2013 Prediksi Akhir Cerita", "As you read the part where the lion let the mouse go, which of the following endings do you anticipate?", ["The mouse forgets about the lion and never helps him", "The lion gets into trouble and no one helps him", "The lion becomes angry at all small animals", "The mouse spreads the lion's kindness to other animals", "The mouse becomes the lion\u2019s loyal assistant"], {"m": [3, 4]}, "Tikus sudah berjanji membalas budi, sehingga akhir yang logis adalah ia menghargai kebaikan singa dan setia padanya. Opsi A, B, C bertentangan dengan janji dan suasana cerita."], [5, "Evaluasi \u2013 Penokohan", "Which of the following sentences from the story help you understand the lion\u2019s character?", ["\u201cThe lion always took his afternoon nap under the shade of a big tree in the bushes.\u201d", "\u201cHe caught the mouse and questioned him for interrupting his nap.\u201d", "\u201cThe lion was amused at the mouse\u2019s words and decided to spare his life.\u201d", "\u201cWith his sharp teeth, the mouse nibbled through the net.\u201d", "\u201cThe lion thanked the mouse immensely for his help.\u201d"], {"m": [1, 2, 4]}, "Watak singa (galak tetapi baik hati dan tahu berterima kasih) terlihat dari tindakannya terhadap tikus. Kalimat 1 hanya kebiasaan, kalimat 4 tindakan tikus."]]}, {"t": "Effective Study Techniques", "k": "Infographic \u00b7 Informasi", "p": "<b>Effective Study Techniques</b>\n1. Know Your Learning Style: Understand whether you learn best by reading, listening, or watching.\n2. Set a Consistent Study Schedule: Study at the same time every day. Regularity helps build strong habits.\n3. Create a Comfortable Study Space: Find a quiet, well-lit, and distraction-free area. Have all your materials ready.\n4. Use the Pomodoro Technique: Study for 25 minutes, then take a 5-minute break. This keeps your mind fresh and focused.\n5. Take Effective Notes: Write key points using methods like mind maps or tables to help remember important information.\n6. Practice and Repeat: Regularly review your material and do practice-questions to deepen understanding and improve retention.\n7. Join a Study Group: Discuss topics with friends to gain new insights and solve problems together.\n8. Leverage Technology: Use apps and websites for flashcards, video lessons, and online quizzes to support your study routine.\n9. Get Enough Sleep: Aim for 7-8 hours.\n10. Be Patient and Persistent: Learning takes time.", "q": [[6, "Tekstual \u2013 Informasi Rinci", "Based on the information given, we can keep our mind focused and fresh by ....", ["knowing your learning style", "using Pomodoro Technique", "using online quizzes apps", "by reviewing materials", "by creating mind maps"], 1, "Poin 4: Pomodoro menjaga pikiran tetap segar dan fokus."], [7, "Tekstual \u2013 Kategori (Time/Self Management)", "Based on the infographic, determine whether each study technique is categorized as <b>Time Management</b> or <b>Self Management</b>.", ["Be patient and persistent", "Use the Pomodoro technique", "Set a consistent study schedule"], [0, 1, 1], "1 Self Management (sikap pribadi). 2 dan 3 Time Management (mengatur waktu belajar dan istirahat).", ["Time Management", "Self Management"]], [8, "Tekstual \u2013 Urutan Informasi", "From the options provided, choose the sequence that best reflects the information in the infographic \u201cEffective Study Techniques\u201d.", ["Set your goal \u2192 Watch lessons videos \u2192 Sleep well \u2192 Have group chat with friends \u2192 Eat nutritious meal", "Plan study time \u2192 Join a study group \u2192 Take long breaks \u2192 Write a to do list \u2192 Write important points", "Know your learning style \u2192 Find a quiet area \u2192 Set a timetable \u2192 Use less gadgets \u2192 Be patient and persistent", "Know your study style \u2192 Plan your study time \u2192 Practice and repeat \u2192 Take a break \u2192 Watch lessons videos", "Take notes \u2192 Join a study groups \u2192 Use different medias \u2192 Play music you like \u2192 Have good meal while studying"], 3, "Opsi D memuat langkah yang semuanya ada di infografik (gaya belajar, jadwal, latihan, istirahat, video). Opsi lain memuat hal yang tidak disebut (goal, long breaks, less gadgets, music)."], [9, "Inferensial \u2013 Tujuan Penulis", "Which of the following statements best reflect the author\u2019s purpose in writing the text?", ["To help students find fun strategies to play after studying", "To offer students guidance on how to learn more efficiently", "To encourage students to use simple habits to improve their learning", "To explain why studying tips is difficult for most students", "To show students that they can manage their time and focus better"], {"m": [1, 2, 4]}, "Infografik berisi panduan dan kebiasaan sederhana agar belajar efisien, termasuk mengatur waktu dan fokus. Tidak membahas bermain atau kesulitan."], [10, "Evaluasi \u2013 Penerapan Informasi", "If you are preparing for an important exam, which techniques can be implemented effectively in your personal study time?", ["Only study when you are in a group discussion with others", "Use technology during all study sessions in or outside class", "Use the Pomodoro Technique to structure your study and break time", "Practice and repeat study material regularly to retain information", "Create a quiet and comfortable study space to improve focus"], {"m": [2, 3, 4]}, "Opsi 1 (hanya kelompok) dan 2 (selalu teknologi) ekstrem dan tidak dianjurkan infografik."]]}, {"t": "The Great Barrier Reef", "k": "Report \u00b7 Deskripsi", "p": "<b>The Great Barrier Reef</b>\nThe Great Barrier Reef is one of the most beautiful places in the world. It is located in the Pacific Ocean, near the northeast coast of Australia. The reef is very big. It stretches over 2,000 kilometers and can even be seen from space. There are many small coral islands and clear, warm waters around the reef.\nThis reef is full of life. There are many kinds of colorful fish, sea turtles, dolphins, and even sharks. Coral of different shapes and colors grows under the water. Sea birds fly over the reef and nest on small islands. People can see this beauty by swimming, diving, or joining a boat tour.\nThe colors under the water are amazing. Coral comes in red, yellow, green, and blue. Some coral looks like trees, and some looks like big round stones. Small fish swim in and out of the coral like they are playing a game. In some places, soft coral moves with the water like grass in the wind. When the sun shines, the reef looks bright and full of light. It feels like a different world under the sea.\nThe reef is not only beautiful, but also very important. It helps protect the coast from big waves and storms. It is a home for sea animals and a place where plants can grow. Many people also get food and jobs from the sea near the reef. Without the reef, the ocean would not be the same.", "q": [[11, "Tekstual \u2013 Informasi Tersurat", "Which of the following descriptions are mentioned clearly in the text?", ["The reef was built by local communities over hundreds of years", "The reef is located in the Pacific Ocean near Australia", "The reef can help protect the coast from big waves", "The reef is home to sea turtles and dolphins", "The reef has more than 10,000 coral islands"], {"m": [1, 2, 3]}, "Opsi 1 dan 5 tidak disebut di teks."], [12, "Inferensial \u2013 Makna Ungkapan", "The author mentioned \u201cIt feels like a different world under the sea\u201d. What does the phrase most likely mean?", ["A safe place that has bright reef", "A peaceful place where people can live under water", "A colorful place that looks the same as the land", "A shining reef that is quiet", "A calm place that looks beautiful and unique"], 4, "Ungkapan itu menegaskan keindahan dan keunikan dunia bawah laut yang berbeda dari daratan."], [13, "Inferensial \u2013 Gagasan Utama Tersirat", "Which of the following best represents the main idea implied by the text?", ["The reef is useful for fishing and shipping", "The reef is large, but not important to people", "The reef is a natural treasure that must be cared for", "The reef is only for scientists and researchers to explore", "The reef is a protected area that should be closed to visitors"], 2, "Teks menekankan reef indah sekaligus penting, sehingga tersirat harus dijaga."], [14, "Evaluasi \u2013 Detail Pendukung", "Which detail would best encourage people to visit the Great Barrier Reef?", ["Visitors can see an Australian national park", "Visitors can stay in hotels around the reef", "Visitors can get there by boat or short flights", "Visitors can protect the coral and the animals", "Visitors can see the coral by diving or swimming"], 4, "Detail paling menarik dan tersurat: melihat karang dengan menyelam atau berenang."], [15, "Evaluasi \u2013 Bukti Pendukung", "Which parts of the text best support the idea that the Great Barrier Reef is both beautiful and important?", ["The reef helps protect the coast from big waves", "It is home to sea turtles, dolphins, and colorful fish", "The coral reefs grow best in cold, deep water", "Some areas of the reef are damaged by starfish and warm water", "The reef was discovered by sailors in the 1800s"], {"m": [0, 1]}, "Opsi 1 menunjukkan pentingnya, opsi 2 menunjukkan keindahan dan kehidupan. Opsi lain tidak ada di teks."]]}, {"t": "Why Teenagers Should Learn to Manage Their Money", "k": "Exposition \u00b7 Argumen", "p": "<b>Why Teenagers Should Learn to Manage Their Money</b>\nMany young people today often spend money on things they like, such as snacks, clothes, or fun activities. But learning to handle money from a young age is very important. Good money habits can help students make a better future.\nHaving a clear plan for the future can show teenagers how to use their money. Students should think about short-term goals, like getting a new phone, and long-term goals, like saving for college or starting a business. Writing these goals down can help students stay motivated and focused.\nA budget helps students see where their money goes every month. It's important to list basic needs like food and travel, and also other costs like clothes or presents. A budget makes it easier to decide how much money to save, spend, or keep for unexpected problems.\nSometimes, students don't know how much they spend on small things. Keeping track of spending with notes or apps can help students understand their habits. This helps them stay within their budget and make changes if needed.\nTeenagers should also learn the difference between saving money and investing money. Saving is safer but slower, while investing has more risk but can earn more money. Knowing both can help students choose the best way for their money goals.\nTo sum up, students who learn to plan, budget, track, and understand saving choices are more ready for the future. That is why learning about money should start early and be done often.\n<b>Table 1. How do students manage their money?</b>\nStudents who save regularly: 45% (save at least 10% of allowance)\nStudents who track expenses: 35% (use apps or notes)\nStudents with financial education: 25% (have learned budgeting in class)\nStudents who often borrow from friends: 30% (due to running out of money)\nStudents who spend most on food &amp; drinks: 50% (largest category of spending)\nStudents who plan monthly budgets: 28% (usually better savers)", "q": [[16, "Tekstual \u2013 Kategori (Short/Long-term)", "Based on the text, choose the category that best fits each activity.", ["Saving money for university", "Saving to buy a new phone", "Starting a business"], [0, 1, 0], "Paragraf 2: telepon baru = jangka pendek; kuliah dan usaha = jangka panjang.", ["Short-term goal", "Long-term goal"]], [17, "Tekstual \u2013 Informasi Tersurat", "According to the text, which of the following actions support smart money management for students?", ["Tracking daily expenses using a notebook or app", "Spending more money than the monthly budget allows", "Setting financial goals for the short and long term", "Borrowing money whenever there is not enough left", "Dividing money into saving, spending, and emergency funds"], {"m": [0, 2, 4]}, "Sesuai paragraf 2 sampai 4. Opsi 2 dan 4 bertentangan dengan anjuran teks."], [18, "Inferensial \u2013 Target Pembaca", "Who is most likely to be the target audience of this text?", ["Teenagers who are learning to manage their money", "Parents looking for tips on how to control their children\u2019s spending", "Students who want to plan for their financial future", "High school readers who need to understand saving and budgeting", "Bankers and financial experts"], {"m": [0, 2, 3]}, "Teks berbicara langsung tentang remaja dan siswa. Orang tua dan bankir bukan sasarannya."], [19, "Evaluasi \u2013 Penambahan Informasi", "Which information would make the text more informative about student spending habits?", ["A paragraph about the history of financial education in schools", "A table showing common monthly high school students expenses", "A graph comparing saving habits between teenagers and adults", "A chart listing popular entertainment choices among students", "A paragraph about students' experiences in managing budget"], 1, "Tabel pengeluaran bulanan siswa paling langsung menjelaskan kebiasaan belanja siswa."], [20, "Evaluasi \u2013 Fakta dan Opini", "Which of the following statements are supported by clear data or facts in the text and table?", ["45% of students save money regularly", "Tracking expenses can help understand spending habits", "Most students do not care about money at all", "Saving 10% of allowance is a good practice", "Spending on fun activities is always better than saving"], {"m": [0, 1]}, "Opsi 1 berdasar data tabel, opsi 2 dinyatakan di teks. Opsi 3, 4, dan 5 adalah opini atau tidak ada dasarnya."]]}, {"t": "Hera and Shero (The False Lion King)", "k": "Narrative \u00b7 Fabel", "p": "<b>Hera and Shero</b>\nOnce upon a time, in Africa, there lived two lion kings. One was named Hera and the other was Shero. Hera was very strong and handsome. All the animals loved and respected him. He was a great leader. Shero was not like Hera. He had a small mane and a funny, squeaky voice. Shero liked to pretend he was as powerful as Hera. He often copied Hera\u2019s roar, but it made the other animals laugh.\nOne day, the animals heard that some hyenas were causing trouble near the river. Hera quickly gathered his followers to stop the hyenas. Shero also wanted to come. He wanted to show everyone that he was strong too. When they reached the river, Hera roared loudly. His roar was so powerful that the hyenas got scared. Shero also tried to roar, but his voice was high and silly. The hyenas laughed at him. Their leader, Hank the Hyena, made jokes about Shero.\nHera stayed calm and smiled. Shero did not give up. He said, \u201cI am just as strong as Hera!\u201d The hyenas laughed even louder. Shero tried to show his power by jumping on a small dirt hill. But he tripped and fell into the ground. The hyenas laughed so much they cried. Even Hera laughed a little.\nAt the end of the day, the hyenas left, still laughing about Shero. Hera told Shero, \u201cYou are not like me, but you make everyone happy with your jokes.\u201d Shero smiled and understood that he had his own special gift.\nFrom that day, Shero became the kingdom\u2019s jester. He and Hera ruled together, one with strength, and one with laughter. The animals learned that both power and fun are important in life.", "q": [[21, "Tekstual \u2013 Urutan Peristiwa", "Which statement provides the most accurate chronological summary of the story's main events?", ["Shero falls into the dirt. The hyenas cause trouble at the river. Hera tells Shero that he is funny. Shero copies Hera's roar. Shero becomes the kingdom's funny helper.", "Hera is a strong lion king. Shero likes to pretend to be strong. The hyenas cause trouble near the river. Hera scares the hyenas, but Shero makes them laugh. Shero learns that making others happy is special.", "Hera and Shero are both strong leaders. The hyenas come to help the lions. Shero tells funny stories to the hyenas. Hera is angry with Shero. The lions and hyenas become friends.", "Shero is a strong lion king. Hera is jealous of Shero. The hyenas attack the lions. Shero defeats the hyenas. Shero becomes the new king.", "Shero wants to be king and fights Hera. The hyenas help Shero. Hera leaves the kingdom. Shero becomes king. Hera returns to forgive Shero."], 1, "Hanya opsi B yang berurutan dan sesuai teks."], [22, "Inferensial \u2013 Pelajaran Cerita", "What can we learn from the story of Hera and Shero?", ["Everyone has something special to give, even if they are not the leader", "Being funny and making others smile is just as important as being strong", "Good friends will support you and help you see your real strengths", "Working together is better when people use their different talents", "Trying your best to help others is more important than always being perfect"], {"m": [0, 1, 3]}, "Akhir cerita: kekuatan dan tawa sama pentingnya, dan keduanya memerintah bersama."], [23, "Tekstual \u2013 Sebab Peristiwa", "The hyenas laugh so much when Shero tries to roar like Hera because ....", ["Shero tries to roar in a serious way and surprises the hyenas", "Shero's roar is funny, which the hyenas think he is joking", "Hera tells a joke about Shero to make the hyenas laugh", "Shero is acting like Hera, and it's absolutely brilliant", "Shero trips and falls when trying to show his strength"], 1, "Suara Shero tinggi dan konyol. Jatuhnya terjadi belakangan, bukan saat mengaum."], [24, "Evaluasi \u2013 Pengandaian Alur", "If in the beginning of the story, Shero is a strong lion with a loud roar, just like Hera, what would happen at the end of the story?", ["Shero and Hera would both scare the hyenas away together", "Shero would become the king, and Hera would leave the savannah", "Shero would get respect from the other animals for his strength", "The hyenas would still laugh at Shero because he is funny", "Shero would try to take Hera\u2019s place as the only lion king"], {"m": [0, 2]}, "Jika Shero kuat, ia akan ikut menakuti hyena dan dihormati. Opsi 4 dan 5 tidak logis dengan pengandaian."], [25, "Evaluasi \u2013 Penokohan", "Shero is clumsy and funny, this is shown when he ....", ["scares the hyenas away with his loud and powerful roar", "makes the other animals smile by pretending to be a great king", "tries to roar like Hera, but his voice is small and makes the hyenas laugh", "walks with Hera to confront the hyenas, acting as if he is an important king too", "tells the hyenas that he is as mighty as King Hera, even though no one believes him"], {"m": [2, 4]}, "Bukti lucu dan konyol: mengaum dengan suara kecil, dan mengaku sekuat Hera padahal tak ada yang percaya."]]}, {"t": "Library Reading Challenge", "k": "Announcement \u00b7 Pengumuman", "p": "<b>Library Reading Challenge</b>\nSMK Harapan Bangsa Library invites all students to join the Reading Challenge from 3 to 28 November.\nHow it works:\n1. Borrow at least four books from different categories: fiction, science, history, and biography.\n2. Write a one-page review for each book.\n3. Submit your reviews to the library by 3 p.m. on 28 November.\nRewards: Every participant who submits all reviews will receive a certificate. The three students with the most thoughtful reviews will each win a book voucher and have their reviews displayed on the school website.\nPlease note: Late submissions will not be accepted, and reviews copied from the internet will be disqualified. Registration is free and open at the library desk until 7 November.\nReading is not just a hobby; it opens doors to new ideas. Join us and start your journey today!", "q": [[26, "Tekstual \u2013 Informasi Rinci", "According to the text, what is the last day for students to register?", ["3 November", "7 November", "28 November",
